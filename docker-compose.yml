services:

  postgres:
    image: postgres:17-alpine
    container_name: devcord-postgres

    environment:
      POSTGRES_DB: devcord
      POSTGRES_USER: devcord
      POSTGRES_PASSWORD: devcord

    ports:
      - "5432:5432"

    volumes:
      - devcord_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcord -d devcord"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devcord_postgres_data: